[project]
name = "mangaproof"
version = "1.0.0"
description = "MangaProof - 漫画翻译质量检查与返修标注工具（独立于 Photoshop 的 PSD QA 工作台）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "psd-tools>=1.18.0",
    "pyside6>=6.11.2",
    "reportlab>=5.0.1",
]

[project.scripts]
mangaproof = "mangaproof.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mangaproof"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
]
speedup = [
    "line-profiler>=5.0.2",
    "memory-profiler>=0.61.0",
    "psutil>=7.2.2",
    "py-spy>=0.4.2",
    "pyinstrument>=5.1.3",
    "pytest-benchmark>=5.3.0",
    "snakeviz>=2.2.2",
]
