[project]
name = "mangaproof"
version = "1.0.0"
description = "MangaProof - 漫画翻译质量检查与返修标注工具（独立于 Photoshop 的 PSD QA 工作台）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "psd-tools>=1.18.0",
    "pyside6>=6.11.2",
    "reportlab>=5.0.1",
]

[project.scripts]
mangaproof = "mangaproof.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mangaproof"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
