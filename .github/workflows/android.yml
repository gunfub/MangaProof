name: Android Build

# 只出 APK（不上 Play，不做 AAB）。
#
# 触发方式：
#   · push 到 master     → 自动构建（**debug**，随后用仓库 keystore 重新签名）
#   · workflow_dispatch  → 手动构建（可选 debug/release、是否签名；默认 debug）
#
# 为什么固定用 debug（真机实测，2026-09）：release 包安装后 lib/<abi>/*.so **不被解压**，
# 而 p4a 的 libs.tmpl.xml 要求按绝对路径加载 QtCore/QtGui/QtWidgets.abi3.so
# （不带 lib 前缀，走不通 System.loadLibrary 在 APK 内查 lib<name>.so 的约定）
# → 启动即 dlopen failed；debug 包正常。曾在清单里注入 extractNativeLibs="true"，
# 经 aapt2 确认属性已生效但真机仍不解压（压不过 AGP 的 useLegacyPackaging），故撤掉该注入。
# debug 包由下方 `Sign APK` 步骤用我们的 release keystore 重新签名，产物可直接分发/侧载。
#
# Qt bootstrap 一次只能处理一个 ABI，所以用 matrix **同时跑两个 ABI**：
# arm64-v8a（aarch64，真机）与 x86_64（模拟器）；两个 APK 分别作为独立 artifact。
# 备注：发布由独立的 release.yml 负责（推送 v* 标签即建 Release），它会把桌面三端
# 与这里的 APK 归并到同一个 Release；因此本工作流只上传工件，不自己建 Release。
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      mode:
        description: "构建类型：debug（默认，so 会被解压，已验证可用）/ release（当前不可用：so 不解压）"
        type: choice
        options: [debug, release]
        default: debug
      sign:
        description: "使用仓库 secrets 中的 keystore 签名"
        type: boolean
        default: true

# Android 构建很重（NDK + 交叉编译），同一分支不允许并发
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYSIDE_VERSION: "6.11.2"
  ANDROID_NDK_VERSION: "27.2.12479018"   # NDK r27c：Qt 6.11 官方支持版本
  ANDROID_API: "35"                      # targetSdk：35 才能保住平板上的强制横屏
  ANDROID_MIN_API: "30"                  # minSdk：MANAGE_EXTERNAL_STORAGE（全文件访问）下限
  QT_WHEEL_BASE: "https://download.qt.io/official_releases/QtForPython"
  # UTF-8 强制：生成 buildozer.spec 时会写入中文目录名（source.exclude_dirs），
  # 而 PySide6 的 deploy_lib 用 open(path, "w") 写文件（依赖 locale）；runner 的
  # locale 若为 C/POSIX，默认编码可能是 ASCII → UnicodeEncodeError。强制 UTF-8 后无此风险。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build-android:
    name: Android ${{ matrix.label }} (${{ inputs.mode || 'debug' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # 两个 ABI 并行；一个失败不拖累另一个（两个 artifact 都要）
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64          # 真机
            label: arm64-v8a
          - arch: x86_64           # 模拟器
            label: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${VER}" >> "$GITHUB_ENV"
          echo "版本号：${VER}"

      # ---------- 工具链 ----------
      - name: Setup Python 3.11（pyside6-android-deploy 硬要求 ≤3.11）
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # 必须在装 NDK 之前清理：runner 预装的 NDK 占用很大，但 $ANDROID_HOME/ndk
      # 正是我们随后要安装 r27c 的位置，放到安装之后会把刚装好的 NDK 删掉。
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          sudo rm -rf "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/ndk/* 2>/dev/null || true
          df -h /

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # ⚠️ 必须显式覆盖：该 action 的默认 packages 是 "tools platform-tools"，
          # 而 Google SDK 仓库里早已没有独立的 `tools` 包（278 个包里 0 个匹配），
          # 沿用默认值会让 sdkmanager 立刻报错、该步骤数秒内失败（本仓库首次运行
          # 就是这样失败的）。cmdline-tools 由 action 自己安装，这里只要 platform-tools。
          packages: "platform-tools"
          accept-android-sdk-licenses: true

      - name: Install Android SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMGR="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          [ -x "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; ls -la "$ANDROID_HOME" || true; exit 1; }
          "$SDKMGR" --version
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${ANDROID_API}.0.0" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_PATH=${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "--- 已安装组件 ---"
          "$SDKMGR" --list_installed | sed -n '1,40p' || true
          [ -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ] || {
            echo "::error::NDK 目录不存在：${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"; exit 1; }

      # buildozer 1.5.0 只认**旧布局** $ANDROID_HOME/tools/bin/sdkmanager（property
      # sdkmanager_path），而现代 cmdline-tools 装在 $ANDROID_HOME/cmdline-tools/latest。
      # Google 早已移除 `tools` 包，所以这个目录永远不会自己出现 → buildozer 直接
      # 报 "sdkmanager ... not installed" 并退出（本次 17s 失败的真正原因）。
      # 做目录级软链接即可：sdkmanager 脚本会 cd 到自身目录的上级并用 pwd -P 解析
      # 真实路径，lib/ 依旧可达。
      - name: Fix cmdline-tools layout for buildozer (legacy tools/ symlink)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$SDK" -maxdepth 5 -type f -name sdkmanager | head -1)"
          fi
          [ -n "$SDKMGR" ] || { echo "::error::找不到 sdkmanager"; ls -la "$SDK" || true; exit 1; }
          CMDLINE="$(cd "$(dirname "$SDKMGR")/.." && pwd -P)"
          echo "cmdline-tools 实际位置：$CMDLINE"
          ln -sfn "$CMDLINE" "$SDK/tools"
          ls -la "$SDK/tools/bin/sdkmanager"
          "$SDK/tools/bin/sdkmanager" --version

      # p4a 官方 Dockerfile 里的系统依赖清单 + 构建本机所需
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ant autoconf automake autopoint ccache cmake g++ gcc git lbzip2 \
            libffi-dev libltdl-dev libtool libssl-dev make patch pkg-config \
            python3-dev unzip wget zip

      # ---------- 依赖 → recipe 覆盖卡口 ----------
      - name: Verify dependency coverage (uv.lock → recipes)
        shell: bash
        run: |
          python3 scripts/android/analyze_lock_deps.py
          python3 scripts/android/analyze_lock_deps.py --fail-on-unknown

      # ---------- 宿主 venv（必须放在项目目录之外，否则会被打进包） ----------
      - name: Create host venv for the deploy tool
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/android-venv"
          source "$RUNNER_TEMP/android-venv/bin/activate"
          pip install -q --upgrade pip
          pip install -q "pyside6==${PYSIDE_VERSION}" jinja2 pkginfo tqdm "packaging==24.1"
          echo "$RUNNER_TEMP/android-venv/bin" >> "$GITHUB_PATH"

      # 预检：把"导入/版本/locale"这类问题在进入构建前暴露出来（失败信息清晰，
      # 也更容易被 Report build failure details 步骤转成 annotation）
      - name: Preflight check (imports, versions, locale)
        shell: bash
        run: |
          source "$RUNNER_TEMP/android-venv/bin/activate"
          set -euo pipefail
          python - <<'PY'
          import importlib, locale, pathlib, sys
          print("python:", sys.version.split()[0], "| stdout encoding:", sys.stdout.encoding)
          print("preferred encoding:", locale.getpreferredencoding(False))
          for name in ("jinja2", "pkginfo", "tqdm", "packaging", "PySide6"):
              mod = importlib.import_module(name)
              print(f"  {name}: {getattr(mod, '__version__', 'ok')}")
          import PySide6
          scripts = pathlib.Path(PySide6.__file__).resolve().parent / "scripts"
          sys.path.insert(0, str(scripts))
          import android_deploy, deploy_lib  # 顶层导入，与官方 CLI 一致
          print("android_deploy:", android_deploy.__file__)
          print("deploy_lib:", deploy_lib.__file__)
          # 中文写盘自检（buildozer.spec 里会出现中文目录名）
          probe = pathlib.Path("/tmp/utf8-probe.txt"); probe.write_text("中文写入自检", encoding="utf-8")
          print("utf-8 write probe:", probe.read_text(encoding="utf-8"))
          PY

      # ---------- Qt Android wheel ----------
      - name: Cache Qt Android wheels
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt-wheels
          key: qt-android-wheels-${{ env.PYSIDE_VERSION }}-${{ matrix.arch }}

      - name: Download Qt Android wheels
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/qt-wheels" && cd "$RUNNER_TEMP/qt-wheels"
          PS="pyside6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl"
          SH="shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl"
          [ -f "$PS" ] || curl -fL -o "$PS" "${QT_WHEEL_BASE}/pyside6/${PS}"
          [ -f "$SH" ] || curl -fL -o "$SH" "${QT_WHEEL_BASE}/shiboken6/${SH}"
          ls -la

      # ---------- 构建 ----------
      - name: Build APK
        id: build
        shell: bash
        run: |
          source "$RUNNER_TEMP/android-venv/bin/activate"
          set -o pipefail
          python scripts/android/build_android.py \
            --pyside-wheel   "$RUNNER_TEMP/qt-wheels/pyside6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl" \
            --shiboken-wheel "$RUNNER_TEMP/qt-wheels/shiboken6-${PYSIDE_VERSION}-${PYSIDE_VERSION}-cp311-cp311-android_${{ matrix.arch }}.whl" \
            --ndk-path "$ANDROID_NDK_PATH" --sdk-path "$ANDROID_HOME" \
            --name MangaProof --mode "${{ inputs.mode || 'debug' }}" --arch "${{ matrix.arch }}" \
            --apk-out "$RUNNER_TEMP/apk_path.txt" -v 2>&1 | tee "$RUNNER_TEMP/build.log"

      # 构建失败时把日志尾部转成 annotation + job summary：
      # job 日志下载接口要求仓库 admin（匿名 403），但 check-run annotations 接口公开可读，
      # 把关键行变成 ::error:: 就能在外部读到失败原因。
      - name: Report build failure details
        if: failure()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/build.log"
          [ -f "$LOG" ] || { echo "::error::构建步骤没有产出日志文件"; exit 0; }
          {
            echo "### Android 构建失败 — 日志尾部"
            echo
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # annotation 有数量上限（每步约 10 条），所以只发最有信息量的 10 行：
          # 优先"最后一次 Traceback 之后的全部内容"，否则退回尾部。
          awk '/^Traceback|Traceback \(most recent call last\)/{n=0; buf=""} {buf=buf $0 "\n"; n++} END{printf "%s", buf}' "$LOG" > "$RUNNER_TEMP/err.log"
          if [ ! -s "$RUNNER_TEMP/err.log" ]; then
            grep -E "Error|error:|Exception|not found|No such|failed|❌" "$LOG" | tail -n 10 > "$RUNNER_TEMP/err.log" || true
          fi
          [ -s "$RUNNER_TEMP/err.log" ] || tail -n 10 "$LOG" > "$RUNNER_TEMP/err.log"
          tail -n 10 "$RUNNER_TEMP/err.log" > "$RUNNER_TEMP/err10.log"
          while IFS= read -r line; do
            line="${line//%/%25}"; line="${line//$'\r'/}"
            echo "::error::${line:0:190}"
          done < "$RUNNER_TEMP/err10.log"

      # 工具的 main() 会吞掉异常（退出码恒为 0），所以必须自己断言产物存在
      - name: Assert APK produced
        shell: bash
        run: |
          set -e
          APK="$(cat "$RUNNER_TEMP/apk_path.txt" 2>/dev/null || true)"
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::未产出 APK（pyside6-android-deploy 内部异常被吞，请查看上方日志）"
            exit 1
          fi
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -la "$APK"

      # 产物内容校验：挡「so 缺失」与「首屏资源没进包」这类只在真机才暴露、
      # 且流水线原本全绿的问题。必需 so / 首屏资源缺一个 → 必须当场失败。
      - name: Verify APK native libs and splash resources
        shell: bash
        run: |
          set -euo pipefail
          APK="$(cat "$RUNNER_TEMP/apk_path.txt")"
          ABI="${{ matrix.arch == 'aarch64' && 'arm64-v8a' || 'x86_64' }}"
          echo "校验 ABI=$ABI 的 APK：$APK"
          LIST="$RUNNER_TEMP/apk_libs.txt"
          unzip -l "$APK" | awk '{print $4}' \
            | grep -E "^lib/$ABI/" | grep -v '/$' | sort > "$LIST" || true
          echo "包内 lib/$ABI 文件数：$(wc -l < "$LIST")"
          echo "--- abi3 / 关键库 ---"
          grep -E "abi3|libpython|libc\+\+_shared|libQt6Core" "$LIST" || true

          # 必需 so：全部来自我核对过的来源，避免"校验本身误报"卡死构建 ——
          #   · Qt*/libpyside6/libshiboken6 的 abi3：PySide6 wheel 顶层 + deploy 工具
          #     的 PySideRecipe.build_arch() 无条件拷贝；
          #   · libpython3.11.so：python3 recipe（我们钉 3.11.5，与 Qt wheel 的 cp311 匹配）；
          #   · libc++_shared.so：PySideRecipe.build_arch() 从 NDK sysroot 拷贝；
          #   · libQt6Core/Gui/Widgets_<abi>.so：Qt wheel 的 PySide6/Qt/lib；
          #   · libplugins_platforms_qtforandroid_<abi>.so：Qt wheel 的平台插件，
          #     CI 的 --load-local-libs 里已包含（缺了 Qt 起不来）。
          REQUIRED=(
            "lib/$ABI/QtCore.abi3.so"
            "lib/$ABI/QtGui.abi3.so"
            "lib/$ABI/QtWidgets.abi3.so"
            "lib/$ABI/libpyside6.abi3.so"
            "lib/$ABI/libshiboken6.abi3.so"
            "lib/$ABI/libpython3.11.so"
            "lib/$ABI/libc++_shared.so"
          )
          MISSING=()
          for f in "${REQUIRED[@]}"; do
            grep -qxF "$f" "$LIST" || MISSING+=("$f")
          done
          # 每个 Qt 模块都要有对应的 libQt6Xxx_<abi>.so（漏了就说明 recipe 拷贝不完整）
          for m in Core Gui Widgets; do
            grep -qE "^lib/$ABI/libQt6${m}_${ABI}\.so$" "$LIST" \
              || MISSING+=("lib/$ABI/libQt6${m}_${ABI}.so")
          done
          # Qt Android 平台插件（没有它 Qt 起不来）
          grep -qE "^lib/$ABI/libplugins_platforms_qtforandroid_${ABI}\.so$" "$LIST" \
            || MISSING+=("lib/$ABI/libplugins_platforms_qtforandroid_${ABI}.so")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            for f in "${MISSING[@]}"; do echo "::error::APK 内缺少必需库：$f"; done
            exit 1
          fi
          echo "✅ 必需 so 齐全（共 $(wc -l < "$LIST") 个）"

          # 首屏（启动底色 + Logo）：资源必须进包，且 windowBackground 必须挂在
          # Activity 用的主题上 —— 只投资源不挂主题 = 首屏不生效（静默失败）。
          # 详见 packaging/android/{res/**,p4a_hook.py}。
          BT2="$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -1)"
          if [ -x "$BT2/aapt2" ]; then
            RES="$RUNNER_TEMP/res_dump.txt"
            "$BT2/aapt2" dump resources "$APK" > "$RES" 2>/dev/null || true
            for name in mangaproof_splash mangaproof_splash_bg; do
              if grep -q "$name" "$RES"; then
                echo "✅ 首屏资源存在：$name"
              else
                echo "::error::APK 里缺少首屏资源 $name（android.add_resources 没投进去？）"
                exit 1
              fi
            done
            if grep -q "mangaproof_splash" "$RES"; then
              echo "✅ 首屏背景已引用（windowBackground）"
            else
              echo "::warning::未见对 mangaproof_splash 的引用（Activity 主题未挂上？首屏可能不生效）"
            fi
          else
            echo "::warning::找不到 aapt2，跳过首屏资源校验"
          fi

          # 附加提示（不阻断）：binder 库名与 openssl 的具体命名随 p4a 版本变化，
          # 仅记录在案便于排查，不作为失败条件。
          grep -qE "^lib/$ABI/libpybundle\.so$" "$LIST" \
            || echo "::warning::未见 libpybundle.so（p4a 版本差异？仅提示）"
          grep -qE "^lib/$ABI/lib(crypto|ssl)[^/]*\.so$" "$LIST" \
            || echo "::warning::未见 openssl 系列库（本应用不依赖，仅提示）"

          # 交给系统安装器用的 FileProvider（需求 §65）：**两条都要查，缺一条就是
          # 真机启动即崩**，而且构建期完全不报错：
          #   · 清单里没声明 provider → openUrl 返回 false，Qt 日志
          #     "No file provider found"（功能失效）；
          #   · 声明了但类不在包里 → 进程启动时 ActivityThread.installContentProviders
          #     实例化它 → ClassNotFoundException（**崩在启动**）。
          # 后者实测踩过：v1.1.14.alpha 的 APK 6 个 dex 里没有任何 androidx 类，
          # 所以构建脚本必须显式加 androidx.core 的 Gradle 依赖。
          # 清单直接用二进制 XML 的字符串池判断（不依赖 aapt2 的参数顺序，避免误报：
          # 若改成 aapt2 dump xmltree 而参数顺序不被接受，这里会变成"假失败"卡住构建）。
          MAN="$RUNNER_TEMP/apk_manifest.bin"
          unzip -p "$APK" AndroidManifest.xml > "$MAN" 2>/dev/null || true
          if grep -qa "androidx.core.content.FileProvider" "$MAN" \
             && grep -qa "com.priloba.mangaproof.qtprovider" "$MAN"; then
            echo "✅ 清单已声明 FileProvider（authority com.priloba.mangaproof.qtprovider）"
          else
            echo "::error::清单缺少 androidx.core.content.FileProvider / qtprovider 授权名 —— 需求 §65 的安装会失效（p4a_hook 没注入？）"
            exit 1
          fi

          # 类必须真的在 dex 里（构建期唯一能查出"启动即崩"的地方）
          DEX="$RUNNER_TEMP/apk_dex.bin"
          unzip -p "$APK" 'classes*.dex' > "$DEX" 2>/dev/null || true
          if grep -qa "androidx/core/content/FileProvider" "$DEX"; then
            echo "✅ dex 内含 androidx.core.content.FileProvider（共 $(stat -c%s "$DEX") 字节 dex）"
          else
            echo "::error::dex 里没有 androidx.core.content.FileProvider —— 该 provider 会被系统在启动时实例化，真机将 ClassNotFoundException 崩溃。请确认 build_android.py 的 ANDROIDX_CORE_DEP 已生效（android.gradle_dependencies）。"
            exit 1
          fi


      # 16 KB page size（Android 15+ / Play 要求）：先只告警，不阻断
      - name: Check 16 KB page alignment (advisory)
        continue-on-error: true
        shell: bash
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "build-tools: $BT"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" || \
            echo "::warning::zipalign 16 KB 校验未通过（记录在案，暂不阻断构建）"

      # ---------- 签名 ----------
      # push 触发时总是尝试签名；手动触发时看 sign 输入。
      # 没配 keystore secrets（例如 fork）时只告警、跳过签名，产出未签名 APK，
      # 不让整条流水线因为"没有 secret"而变红。
      - name: Sign APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sign }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -e
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64，跳过签名（将产出未签名 APK，不能直接安装）"
            exit 0
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_B64" | base64 -d > "$KS"
          OUT="$GITHUB_WORKSPACE/MangaProof-${APP_VERSION}-android-${{ matrix.arch }}.apk"
          "$BT/zipalign" -p -f 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          rm -f "$KS"
          echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"
          echo "已签名：$OUT（$(du -h "$OUT" | cut -f1)）"

      - name: Stage artifact path
        shell: bash
        run: |
          if [ -z "${SIGNED_APK:-}" ]; then
            OUT="$GITHUB_WORKSPACE/MangaProof-${APP_VERSION}-android-${{ matrix.arch }}-unsigned.apk"
            cp "$APK" "$OUT"
            echo "SIGNED_APK=$OUT" >> "$GITHUB_ENV"
            echo "未签名：$OUT"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ env.APP_VERSION }}-android-${{ matrix.arch }}
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          # 不设 retention-days：与桌面 build.yml 一致，走仓库默认保留期
          # （upload-artifact 默认 90 天，仓库设置调整时两边同步生效）
