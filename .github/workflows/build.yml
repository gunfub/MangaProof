name: build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：PyInstaller 不支持 Windows ARM64 原生构建，
          # ARM64 设备可通过 x64 模拟运行 x64 包
          - os: windows-latest
            arch: x64
            spec: packaging/main_win.spec
            artifact: windows-x64
          - os: ubuntu-24.04
            arch: x64
            spec: packaging/main_linux.spec
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            spec: packaging/main_linux.spec
            artifact: linux-arm64
          # macOS 13 跑者已退役：Intel 使用 macos-15-intel，
          # Apple Silicon 使用 macos-15（arm64）
          - os: macos-15-intel
            arch: x64
            spec: packaging/main_macos.spec
            artifact: macos-x64
          - os: macos-15
            arch: arm64
            spec: packaging/main_macos.spec
            artifact: macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # 用 sed -E（GNU/BSD 通用），macOS 的 BSD grep 不支持 -P
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean "${{ matrix.spec }}"

      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3

      - name: Smoke test (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            BIN="dist/MangaProof.app/Contents/MacOS/MangaProof"
          else
            BIN="dist/MangaProof/MangaProof"
          fi
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::打包产物启动后提前退出，输出如下："
            cat smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          tail -20 smoke.log || true

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "dist\MangaProof\MangaProof.exe" `
            -RedirectStandardOutput "smoke.log" -RedirectStandardError "smoke.err" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "打包产物启动后提前退出（exit=$($p.ExitCode)）"
            Get-Content "smoke.log","smoke.err" -ErrorAction SilentlyContinue
            exit 1
          }
          Stop-Process -Id $p.Id -Force

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" -C dist MangaProof

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MangaProof.app" \
            "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\MangaProof" `
            -DestinationPath "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: |
            MangaProof-*.tar.gz
            MangaProof-*.zip
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/* \
            --title "MangaProof ${{ github.ref_name }}" \
            --generate-notes
