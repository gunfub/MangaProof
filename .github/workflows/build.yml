name: build

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Windows 的 _psd_fast.pyd 在 Linux 上用 mingw-w64 交叉编译（纯 C，
  # ctypes 可直接加载），避免依赖 Windows runner 上的 MSVC 环境。
  accel-win:
    name: windows accel (mingw cross)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install mingw
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - name: Cross-compile _psd_fast.pyd
        run: |
          x86_64-w64-mingw32-gcc -O3 -shared -o mangaproof/_psd_fast.pyd mangaproof/_psd_fast.c
          ls -la mangaproof/_psd_fast.pyd
      - name: Upload accel artifact
        uses: actions/upload-artifact@v7
        with:
          name: accel-windows
          path: mangaproof/_psd_fast.pyd
          if-no-files-found: error

  build-linux:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
            spec: packaging/main_linux.spec
            artifact: linux-x64
          - os: ubuntu-24.04-arm
            arch: arm64
            spec: packaging/main_linux.spec
            artifact: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Build accel extension
        shell: bash
        run: uv run python scripts/build_accel.py
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean "${{ matrix.spec }}"
      - name: Install Qt runtime libs
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3
      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/MangaProof/MangaProof"
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::打包产物启动后提前退出，输出如下："
            cat smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          tail -20 smoke.log || true
      - name: Package artifact
        shell: bash
        run: |
          tar -czf "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz" -C dist MangaProof
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.tar.gz
          if-no-files-found: error

  build-macos:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
            spec: packaging/main_macos.spec
            artifact: macos-x64
          - os: macos-15
            arch: arm64
            spec: packaging/main_macos.spec
            artifact: macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Build accel extension
        shell: bash
        run: uv run python scripts/build_accel.py
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean "${{ matrix.spec }}"
      - name: Smoke test
        shell: bash
        run: |
          BIN="dist/MangaProof.app/Contents/MacOS/MangaProof"
          QT_QPA_PLATFORM=offscreen QT_DEBUG_PLUGINS=1 "$BIN" > smoke.log 2>&1 &
          PID=$!
          sleep 10
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::打包产物启动后提前退出，输出如下："
            cat smoke.log || true
            exit 1
          fi
          kill "$PID" 2>/dev/null || true
          tail -20 smoke.log || true
      - name: Package artifact
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MangaProof.app" \
            "MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}
          path: MangaProof-${{ steps.version.outputs.version }}-${{ matrix.artifact }}.zip
          if-no-files-found: error

  build-windows:
    name: windows-x64
    runs-on: windows-latest
    needs: accel-win
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER=$(sed -nE 's/^__version__ = "([^"]+)".*/\1/p' mangaproof/__init__.py)
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Download accel extension
        uses: actions/download-artifact@v8
        with:
          name: accel-windows
          path: mangaproof
      - name: Verify accel present
        shell: pwsh
        run: |
          if (-not (Test-Path "mangaproof\_psd_fast.pyd")) {
            Write-Error "未找到 _psd_fast.pyd"
            exit 1
          }
      - name: Build with PyInstaller
        shell: bash
        run: uv run pyinstaller --noconfirm --clean packaging/main_win.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $p = Start-Process -FilePath "dist\MangaProof\MangaProof.exe" `
            -RedirectStandardOutput "smoke.log" -RedirectStandardError "smoke.err" -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            Write-Error "打包产物启动后提前退出（exit=$($p.ExitCode)）"
            Get-Content "smoke.log","smoke.err" -ErrorAction SilentlyContinue
            exit 1
          }
          taskkill /PID $($p.Id) /T /F | Out-Null
          Start-Sleep -Seconds 2
      - name: Stage artifact
        shell: pwsh
        run: |
          $dest = "MangaProof-${{ steps.version.outputs.version }}-windows-x64"
          Remove-Item $dest -Recurse -Force -ErrorAction SilentlyContinue
          $ok = $false
          for ($i = 0; $i -lt 10; $i++) {
            try {
              Copy-Item -Recurse -Force "dist\MangaProof" $dest -ErrorAction Stop
              $ok = $true
              break
            } catch {
              Write-Host "stage 重试 $($i+1)/10 失败：$($_.Exception.Message)"
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ok) { Write-Error "暂存目录失败（详见上方重试信息）"; exit 1 }
          Get-ChildItem $dest | Select-Object -First 3 -ExpandProperty Name
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MangaProof-${{ steps.version.outputs.version }}-windows-x64
          path: MangaProof-${{ steps.version.outputs.version }}-windows-x64/**
          if-no-files-found: error

  release:
    name: Create release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/* \
            --title "MangaProof ${{ github.ref_name }}" \
            --generate-notes
